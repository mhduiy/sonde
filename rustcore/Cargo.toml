[package]
name = "sondecore"
version = "0.1.0"
edition = "2021"
description = "Sonde D-Bus engine: monitor, introspect, inspect, call"

[lib]
crate-type = ["staticlib"]

[dependencies]
zbus = { version = "5.19", features = ["blocking-api"] }
zvariant = "5.15"
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
